<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTrack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #1d1d1f;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      background: #1d1d1f;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-sub   { font-size: 11px; color: #6e6e73; margin-top: 1px; }

    /* ── Status badge ── */
    .status-wrap {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-badge.idle     { background: #f1f1f3; color: #6e6e73; }
    .status-badge.idle     .dot { background: #aaa; }
    .status-badge.capturing { background: #fff7ed; color: #c2410c; }
    .status-badge.capturing .dot { background: #f97316; animation: pulse 1s infinite; }
    .status-badge.connected { background: #f0fdf4; color: #166534; }
    .status-badge.connected .dot { background: #22c55e; }
    .status-badge.error    { background: #fef2f2; color: #991b1b; }
    .status-badge.error    .dot { background: #ef4444; }

    .status-time {
      font-size: 11px;
      color: #9a9aa0;
      margin-top: 4px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Token section ── */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .token-row {
      display: flex;
      gap: 8px;
    }
    .token-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      outline: none;
      background: #f9f9fb;
      color: #1d1d1f;
      transition: border-color 0.15s;
    }
    .token-input:focus { border-color: #1d1d1f; background: #fff; }
    .token-input::placeholder { color: #c7c7cc; }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-save   { background: #f1f1f3; color: #1d1d1f; }
    .btn-save:hover:not(:disabled)   { background: #e5e5ea; }
    .btn-primary { background: #1d1d1f; color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { opacity: 0.82; }
    .btn-ghost   { background: transparent; color: #6e6e73; font-size: 12px; padding: 6px 10px; }
    .btn-ghost:hover:not(:disabled) { color: #1d1d1f; background: #f1f1f3; }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .actions-row {
      display: flex;
      gap: 8px;
    }

    /* ── Error message ── */
    .error-msg {
      margin: 0 16px 12px;
      padding: 8px 12px;
      background: #fef2f2;
      border-radius: 8px;
      font-size: 12px;
      color: #991b1b;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      text-align: center;
      font-size: 11px;
      color: #c7c7cc;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">S</div>
    <div>
      <div class="header-title">StudyTrack</div>
      <div class="header-sub">Moodle автосинхронізація</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-wrap">
    <div id="statusBadge" class="status-badge idle">
      <span class="dot"></span>
      <span id="statusText">Не підключено</span>
    </div>
    <div id="statusTime" class="status-time"></div>
  </div>

  <!-- Supabase Access Token -->
  <div class="section">
    <div class="section-label">Supabase Access Token</div>
    <div class="token-row">
      <input
        id="tokenInput"
        class="token-input"
        type="password"
        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btnSaveToken" class="btn btn-save">Зберегти</button>
    </div>
    <div style="font-size: 11px; color: #9a9aa0; margin-top: 6px;">
      StudyTrack → профіль → скопіюй access token
    </div>
  </div>

  <!-- Error -->
  <div id="errorMsg" class="error-msg"></div>

  <!-- Actions -->
  <div class="actions">
    <button id="btnSync" class="btn btn-primary" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Синхронізувати зараз
    </button>
    <div class="actions-row">
      <button id="btnOpenMoodle" class="btn btn-ghost" style="flex:1">
        Відкрити Moodle
      </button>
      <button id="btnDisconnect" class="btn btn-ghost" style="flex:1; color: #ef4444;">
        Відключити
      </button>
    </div>
  </div>

  <div class="footer">StudyTrack Extension v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
